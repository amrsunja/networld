name: brokies
description: "A new social network based on your bank money."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Localization
  intl: ^0.20.2

  # State management
  flutter_hooks: ^0.21.3+1
  hooks_riverpod: ^3.1.0

  # UI
  flutter_svg: ^2.2.3
  google_fonts: ^6.3.3
  shimmer: ^3.0.0
  dismissible_page: ^1.0.2
  percent_indicator: ^4.2.5
  flutter_confetti: ^0.5.1
  animated_flip_counter: ^0.3.4
  cupertino_native: ^0.1.1
  crystal_navigation_bar: ^1.1.0

  # Media picker
  photo_manager: ^3.7.1
  image_picker: ^1.1.2
  sliding_up_panel: ^2.0.0+1
  audio_waveforms: ^1.3.0

  # Database
  sqflite_sqlcipher: ^3.4.0
  flutter_secure_storage: ^10.0.0

  # Network
  internet_connection_checker_plus: ^2.7.1

  # Server
  supabase_flutter: ^2.12.0
  google_sign_in: ^7.2.0

  # Navigation
  auto_route: ^11.1.0

  # In app purchase
  in_app_purchase: ^3.2.3


  # Notifications
  app_settings: ^7.0.0
  permission_handler: ^12.0.1


  # Utils
  iconic: ^0.1.0
  flutter_inappwebview: ^6.1.5
  flutter_statusbarcolor_ns: ^0.6.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.0
  flutter_animate: ^4.5.2
  multiple_result: ^5.2.0
  freezed_annotation: ^3.1.0
  collection: ^1.19.1
  equatable: ^2.0.7
  path_provider: ^2.1.5
  cached_network_image: ^3.4.1
  flutter_dotenv: ^5.2.1
  simple_gradient_text: ^1.4.0
  blur: ^4.0.2
  package_info_plus: ^8.0.0





dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: 
  auto_route_generator: ^10.4.0
  flutter_gen_runner: ^5.12.0
  freezed: ^3.2.3
  icons_launcher: ^3.0.3
  package_rename: ^1.10.1


flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - .env

